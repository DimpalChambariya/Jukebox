services:
  - type: web
    name: mic-jukebox-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /healthz
    # No persistent disk: on Render this means the SQLite DB (admin config,
    # votes, guest cooldown history) resets on every redeploy/restart -
    # acceptable tradeoff for not paying for a disk. The one thing that
    # actually needs to survive restarts, the Spotify connection, doesn't
    # depend on this: SPOTIFY_REFRESH_TOKEN/SPOTIFY_USER_ID below are set as
    # real Render env vars (platform-persisted, unaffected by disk), copied
    # from the admin panel's "Connect Spotify Account" success screen once.
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVICE_ROLE
        value: merged
      - key: COOKIE_SECURE
        value: "true"
      - key: CLIENT_URL
        sync: false
      - key: ADMIN_CLIENT_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: SPOTIFY_REDIRECT_URI
        sync: false
      - key: SPOTIFY_REFRESH_TOKEN
        sync: false
      - key: SPOTIFY_USER_ID
        sync: false
